name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Run Linter (Ruff)
        run: |
          ruff check app/ tests/ configs/

      - name: Run Automated Test Suite (Pytest)
        run: |
          pytest tests/ -v

  docker-build:
    name: Docker Build Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Model Artifacts for CI Build
        run: |
          mkdir -p models
          if [ ! -f models/pcb_defect_best.onnx ]; then
            echo "Creating mock ONNX model for CI docker build verification..."
            touch models/pcb_defect_best.onnx
          fi
          if [ ! -f models/metadata.json ]; then
            echo '{"model_name":"DeepPCB-YOLOv8","version":"1.0.0","classes":["open","short","mousebite","spur","copper","pin-hole"]}' > models/metadata.json
          fi

      - name: Build Docker Image
        run: |
          docker build -t pcb-defect-api:latest .
