name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1 ruff==0.17.4 onnx==1.23.2 pillow

      - name: Run Linter (Ruff)
        run: |
          ruff check app/ ml/ scripts/ tests/

      - name: Run Automated Test Suite (Pytest)
        run: |
          pytest tests/ -v

  docker-build:
    name: Docker Runtime Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1 ruff==0.17.4 onnx==1.23.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Valid CI Model Fixture
        run: |
          python scripts/create_ci_model.py --output-dir models

      - name: Verify Model-backed API Startup
        env:
          RUN_MODEL_INTEGRATION: "1"
        run: pytest tests/test_detector.py -m integration -v

      - name: Build Docker Image
        run: docker build -t pcb-defect-api:ci .

      - name: Start Container and Check Inference
        run: |
          docker run -d --name pcb-ci -p 127.0.0.1:8000:8000 pcb-defect-api:ci
          python scripts/smoke_api.py --expected-model ci-fixture

      - name: Show Container Logs
        if: always()
        run: docker logs pcb-ci || true

      - name: Stop Test Container
        if: always()
        run: docker rm -f pcb-ci || true
