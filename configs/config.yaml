app:
  title: "Industrial PCB Defect Detection API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000

model:
  type: yolov8n.pt
  imgsz: 640

train:
  data: configs/data.yaml
  epochs: 50
  batch_size: 16
  device: "0"
  workers: 4
  optimizer: auto
  lr0: 0.01

inference:
  model_path: models/pcb_defect_best.onnx
  metadata_path: models/metadata.json
  conf_threshold: 0.25
  iou_threshold: 0.45
  device: "cpu"

paths:
  project_dir: runs/train
  experiment_name: pcb_defect_v1
  output_model_dir: models