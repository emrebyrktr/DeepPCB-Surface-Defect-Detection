stages:
  prepare_data:
    cmd: python -m ml.prepare_data
    deps:
      - data/raw
      - ml/prepare_data.py
    outs:
      - data/processed

  train:
    cmd: python -m ml.train --config configs/config.yaml
    deps:
      - configs/config.yaml
      - configs/data.yaml
      - data/processed
      - ml/train.py
    outs:
      - models/pcb_defect_best.pt

  export:
    cmd: python -m ml.export_package --model models/pcb_defect_best.pt --config configs/config.yaml
    deps:
      - configs/config.yaml
      - app/core/onnx_detector.py
      - ml/export_package.py
      - ml/tracker.py
      - models/pcb_defect_best.pt
    outs:
      - models/metadata.json
      - models/pcb_defect_best.onnx

  evaluate:
    cmd: python -m ml.evaluate --model models/pcb_defect_best.onnx --config configs/config.yaml --output reports/metrics.json
    deps:
      - configs/config.yaml
      - configs/data.yaml
      - data/processed/test
      - ml/evaluate.py
      - ml/tracker.py
      - models/pcb_defect_best.onnx
      - models/metadata.json
    metrics:
      - reports/metrics.json:
          cache: false

